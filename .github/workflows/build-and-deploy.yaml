name: CI/CD Production Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Назва репозиторію в нижньому регістрі для Docker
  IMAGE_PREFIX: ${{ github.repository_owner }}/library-service

jobs:
  # 1. Перевірка стилю коду Python
  lint-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api_gateway, book_service, user_service, reading_service]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Lint with flake8
        run: |
          # Зупиняємо білд при помилках синтаксису (E9, F63, F7, F82)
          flake8 Library/${{ matrix.service }} --count --select=E9,F63,F7,F82 --show-source --statistics
          # Стилістичні помилки пропускаємо (exit-zero), щоб не блокувати пайплайн
          flake8 Library/${{ matrix.service }} --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # 2. Базові тести для Python сервісів
  test-python:
    needs: lint-python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api_gateway, book_service, user_service, reading_service]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          if [ -f Library/${{ matrix.service }}/requirements.txt ]; then
            pip install -r Library/${{ matrix.service }}/requirements.txt
          fi
      - name: Smoke test (Check imports)
        run: |
          cd Library/${{ matrix.service }}
          # Перевірка, чи запускається основний файл (без підключення до БД)
          python -c "import main" || echo "Warning: Could not import main.py"

  # 3. Перевірка та збірка фронтенду
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Library/frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd Library/frontend
          npm ci
      - name: Build frontend
        run: |
          cd Library/frontend
          npm run build

  # 4. Збірка Docker образів та пуш у GHCR
  build-and-push:
    needs: [test-python, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Включаючи frontend для створення Docker образу
        service: [api_gateway, book_service, user_service, reading_service, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Library/${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 5. Деплой (фінальний етап)
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "### CI/CD Pipeline Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "All images built and pushed to GHCR." >> $GITHUB_STEP_SUMMARY
