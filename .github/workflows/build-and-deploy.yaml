name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      siteName:
        description: 'Service name to deploy'
        type: string
        required: false

jobs:
  # 1. Перевірка Python сервісів (Лінтинг та швидкий тест імпорту)
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api_gateway, book_service, user_service, reading_service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lint & Import Check
        run: |
          pip install flake8
          # Перевірка стилю (не зупиняє білд завдяки --exit-zero)
          flake8 Library/${{ matrix.service }} --exit-zero --max-line-length=127
          # Перевірка, чи файл main.py взагалі запускається
          cd Library/${{ matrix.service }}
          if [ -f main.py ]; then python -c "import main" || echo "Import check failed"; fi

  # 2. Збірка та пуш Docker образів (включаючи frontend)
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        service: [api_gateway, book_service, user_service, reading_service, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./Library/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/library-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/library-${{ matrix.service }}:${{ github.sha }}
